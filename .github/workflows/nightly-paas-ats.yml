name: Nightly PaaS ATS

on:
  schedule:
    # Scheduled nightly at 02:17 UTC. GitHub may start later.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Target to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - trunk
          - 6.6.x
      force:
        description: "Force deployment even if composer.lock did not change"
        required: false
        default: false
        type: boolean
      notify_slack:
        description: "Post the final nightly status to Slack"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: nightly-paas-ats
  cancel-in-progress: false

jobs:
  trunk:
    name: Trunk target
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'trunk'
    uses: ./.github/workflows/nightly-paas-ats-target.yml
    with:
      target: trunk
      target_slug: trunk
      paas_branch: paas/trunk
      paas_application: nightly-ats-trunk
      shopware_ref: trunk
      ats_config_suffix: TRUNK
      force: ${{ inputs.force || false }}
    secrets: inherit

  v66:
    name: Shopware 6.6.x target
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == '6.6.x'
    uses: ./.github/workflows/nightly-paas-ats-target.yml
    with:
      target: 6.6.x
      target_slug: v66
      paas_branch: paas/6.6.x
      paas_application: nightly-ats-66x
      shopware_ref: 6.6.x
      ats_config_suffix: V66
      force: ${{ inputs.force || false }}
    secrets: inherit

  notify-slack:
    name: Notify Slack
    needs:
      - trunk
      - v66
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.notify_slack)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Notify Slack nightly status
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}

          TRUNK_CALL_RESULT: ${{ needs.trunk.result }}
          TRUNK_OVERALL_RESULT: ${{ needs.trunk.outputs.overall_result }}
          TRUNK_DEPLOY_RESULT: ${{ needs.trunk.outputs.deployment_result }}
          TRUNK_DEPLOY_SUMMARY: ${{ needs.trunk.outputs.deployment_summary }}
          TRUNK_DEPLOY_STAGE: ${{ needs.trunk.outputs.deployment_stage }}
          TRUNK_DEPLOY_BRANCH: ${{ needs.trunk.outputs.deployment_branch }}
          TRUNK_DEPLOY_APPLICATION: ${{ needs.trunk.outputs.deployment_application }}
          TRUNK_DEPLOY_CHANGED: ${{ needs.trunk.outputs.deployment_changed }}
          TRUNK_DEPLOY_COMMIT: ${{ needs.trunk.outputs.deployment_commit }}
          TRUNK_ATS_RESULT: ${{ needs.trunk.outputs.ats_result }}
          TRUNK_ATS_SUMMARY: ${{ needs.trunk.outputs.ats_summary }}

          V66_CALL_RESULT: ${{ needs.v66.result }}
          V66_OVERALL_RESULT: ${{ needs.v66.outputs.overall_result }}
          V66_DEPLOY_RESULT: ${{ needs.v66.outputs.deployment_result }}
          V66_DEPLOY_SUMMARY: ${{ needs.v66.outputs.deployment_summary }}
          V66_DEPLOY_STAGE: ${{ needs.v66.outputs.deployment_stage }}
          V66_DEPLOY_BRANCH: ${{ needs.v66.outputs.deployment_branch }}
          V66_DEPLOY_APPLICATION: ${{ needs.v66.outputs.deployment_application }}
          V66_DEPLOY_CHANGED: ${{ needs.v66.outputs.deployment_changed }}
          V66_DEPLOY_COMMIT: ${{ needs.v66.outputs.deployment_commit }}
          V66_ATS_RESULT: ${{ needs.v66.outputs.ats_result }}
          V66_ATS_SUMMARY: ${{ needs.v66.outputs.ats_summary }}
        run: |
          set -euo pipefail

          status_label() {
            case "$1" in
              success) echo "SUCCESS" ;;
              failure) echo "FAILURE" ;;
              skipped) echo "SKIPPED" ;;
              cancelled) echo "CANCELLED" ;;
              *) tr '[:lower:]' '[:upper:]' <<<"${1:-UNKNOWN}" ;;
            esac
          }

          status_icon() {
            case "$1" in
              success) echo ":large_green_circle:" ;;
              failure) echo ":red_circle:" ;;
              skipped) echo ":large_yellow_circle:" ;;
              cancelled) echo ":black_circle:" ;;
              *) echo ":white_circle:" ;;
            esac
          }

          target_details=""
          selected_targets=0
          overall="success"

          append_target() {
            local name="$1"
            local call_result="$2"
            local reported_overall="$3"
            local deploy_result="$4"
            local deploy_summary="$5"
            local deploy_stage="$6"
            local branch="$7"
            local application="$8"
            local changed="$9"
            local commit="${10}"
            local ats_result="${11}"
            local ats_summary="${12}"

            selected_targets=$((selected_targets + 1))

            local target_result="${reported_overall:-$call_result}"
            if [[ "$call_result" != "success" ]]; then
              target_result="$call_result"
            fi
            if [[ "$target_result" != "success" ]]; then
              overall="failure"
            fi

            deploy_result="${deploy_result:-$call_result}"
            deploy_summary="${deploy_summary:-Deployment workflow result: ${call_result}.}"
            deploy_stage="${deploy_stage:-unknown}"
            branch="${branch:-unknown}"
            application="${application:-unknown}"
            changed="${changed:-unknown}"
            commit="${commit:-unknown}"
            ats_result="${ats_result:-skipped}"
            ats_summary="${ats_summary:-ATS result unavailable; inspect the target run.}"

            local target_icon
            local target_label
            local deploy_icon
            local deploy_label
            local ats_icon
            local ats_label
            target_icon="$(status_icon "$target_result")"
            target_label="$(status_label "$target_result")"
            deploy_icon="$(status_icon "$deploy_result")"
            deploy_label="$(status_label "$deploy_result")"
            ats_icon="$(status_icon "$ats_result")"
            ats_label="$(status_label "$ats_result")"

            if [[ -n "$target_details" ]]; then
              target_details+=$'\n\n'
            fi
            target_details+="*${name}:* ${target_icon} *${target_label}*"
            target_details+=$'\n'
            target_details+="*Deploy:* ${deploy_icon} ${deploy_label} — ${deploy_summary}"
            target_details+=$'\n'
            target_details+="*ATS:* ${ats_icon} ${ats_label} — ${ats_summary}"
            target_details+=$'\n'
            target_details+="*Application:* ${application}  •  *Branch:* ${branch}  •  *Commit:* \`${commit}\`"
            target_details+=$'\n'
            target_details+="*Stage:* ${deploy_stage}  •  *Lock changed:* ${changed}"
          }

          if [[ "$TRUNK_CALL_RESULT" != "skipped" ]]; then
            append_target \
              "trunk" \
              "$TRUNK_CALL_RESULT" \
              "$TRUNK_OVERALL_RESULT" \
              "$TRUNK_DEPLOY_RESULT" \
              "$TRUNK_DEPLOY_SUMMARY" \
              "$TRUNK_DEPLOY_STAGE" \
              "$TRUNK_DEPLOY_BRANCH" \
              "$TRUNK_DEPLOY_APPLICATION" \
              "$TRUNK_DEPLOY_CHANGED" \
              "$TRUNK_DEPLOY_COMMIT" \
              "$TRUNK_ATS_RESULT" \
              "$TRUNK_ATS_SUMMARY"
          fi

          if [[ "$V66_CALL_RESULT" != "skipped" ]]; then
            append_target \
              "6.6.x" \
              "$V66_CALL_RESULT" \
              "$V66_OVERALL_RESULT" \
              "$V66_DEPLOY_RESULT" \
              "$V66_DEPLOY_SUMMARY" \
              "$V66_DEPLOY_STAGE" \
              "$V66_DEPLOY_BRANCH" \
              "$V66_DEPLOY_APPLICATION" \
              "$V66_DEPLOY_CHANGED" \
              "$V66_DEPLOY_COMMIT" \
              "$V66_ATS_RESULT" \
              "$V66_ATS_SUMMARY"
          fi

          if [[ "$selected_targets" -eq 0 ]]; then
            overall="failure"
            target_details="No target workflow ran."
          fi

          if [[ "$overall" == "success" ]]; then
            status_color="#2eb67d"
          else
            status_color="#e01e5a"
          fi

          overall_label="$(status_label "$overall")"
          overall_icon="$(status_icon "$overall")"

          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "::error title=Missing Slack webhook::SLACK_WEBHOOK_URL is not configured; cannot send the nightly status notification."
            exit 1
          fi

          payload="$(jq -n \
            --arg text "Nightly PaaS ATS ${overall_label}: ${TARGET_SELECTION}" \
            --arg status_color "$status_color" \
            --arg overall_icon "$overall_icon" \
            --arg overall_label "$overall_label" \
            --arg target_selection "$TARGET_SELECTION" \
            --arg target_details "$target_details" \
            --arg run "$RUN_URL" \
            '{
              text: $text,
              attachments: [
                {
                  color: $status_color,
                  fallback: $text,
                  blocks: [
                    {type: "section", text: {type: "mrkdwn", text: "*Nightly PaaS ATS:* \($overall_icon) *\($overall_label)*\n*Selected targets:* \($target_selection)"}},
                    {type: "section", text: {type: "mrkdwn", text: $target_details}},
                    {type: "section", text: {type: "mrkdwn", text: "*Run:* <\($run)|Open GitHub Actions>"}}
                  ]
                }
              ]
            }')"

          response_file="${RUNNER_TEMP}/slack-response.txt"
          if ! http_status="$(curl -sS -o "$response_file" -w "%{http_code}" -H "Content-Type: application/json" -d "$payload" "$SLACK_WEBHOOK_URL")"; then
            echo "::error title=Slack notification failed::Slack webhook request failed."
            if [[ -s "$response_file" ]]; then
              sed -n '1,20p' "$response_file"
            fi
            exit 1
          fi

          if (( http_status < 200 || http_status >= 300 )); then
            echo "::error title=Slack notification failed::Slack webhook returned HTTP ${http_status}."
            if [[ -s "$response_file" ]]; then
              sed -n '1,20p' "$response_file"
            fi
            exit 1
          fi

          echo "Slack notification sent."
