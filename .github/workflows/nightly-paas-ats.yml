name: Nightly PaaS ATS

on:
  schedule:
    # Scheduled nightly at 02:17 UTC. GitHub may start later.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Target to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - trunk
          - 6.6.x
      force:
        description: "Force deployment even if composer.lock did not change"
        required: false
        default: false
        type: boolean
      notify_slack:
        description: "Post the final nightly status to Slack"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: nightly-paas-ats
  cancel-in-progress: false

jobs:
  trunk:
    name: Trunk target
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'trunk'
    uses: ./.github/workflows/nightly-paas-ats-target.yml
    with:
      target: trunk
      target_slug: trunk
      paas_branch: paas/trunk
      paas_application: nightly-ats-trunk
      shopware_ref: trunk
      ats_config_suffix: TRUNK
      force: ${{ inputs.force || false }}
    secrets: inherit

  v66:
    name: Shopware 6.6.x target
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == '6.6.x'
    uses: ./.github/workflows/nightly-paas-ats-target.yml
    with:
      target: 6.6.x
      target_slug: v66
      paas_branch: paas/6.6.x
      paas_application: nightly-ats-66x
      shopware_ref: 6.6.x
      ats_config_suffix: V66
      force: ${{ inputs.force || false }}
    secrets: inherit

  notify-slack:
    name: Notify Slack
    needs:
      - trunk
      - v66
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.notify_slack)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/parse-ats-results.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Fetch and parse ATS job logs
        id: parse_logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Fetch all jobs from this workflow run (best-effort; do not fail Slack notification)
          jobs="$(gh api "/repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" --jq '.jobs[] | select(.name | contains("ATS Platform")) | {id, name}' 2>/dev/null || true)"

          if [[ -z "$jobs" ]]; then
            echo "test_details=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Collect logs from all ATS Platform shard jobs
          combined_logs_file="${RUNNER_TEMP}/ats-logs.txt"
          : > "$combined_logs_file"
          while IFS=$'\t' read -r job_id job_name; do
            echo "Fetching logs for: $job_name"
            logs_zip="${RUNNER_TEMP}/job-${job_id}-logs.zip"
            job_logs_file="${RUNNER_TEMP}/job-${job_id}-logs.txt"

            if gh api "/repos/${GH_REPO}/actions/jobs/${job_id}/logs" > "$logs_zip" 2>/dev/null; then
              if unzip -p "$logs_zip" > "$job_logs_file" 2>/dev/null && [[ -s "$job_logs_file" ]]; then
                {
                  printf '=== %s ===\n' "$job_name"
                  cat "$job_logs_file"
                  printf '\n'
                } >> "$combined_logs_file"
              fi
            fi
          done < <(printf '%s\n' "$jobs" | jq -r '[.id, .name] | @tsv')

          if [[ ! -s "$combined_logs_file" ]]; then
            echo "test_details=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Parse logs with Python script to extract failed/flaky tests
          test_details=$(python3 .github/scripts/parse-ats-results.py - < "$combined_logs_file" 2>/dev/null || echo "")

          if [[ -n "$test_details" ]]; then
            # Escape for output variable
            echo "test_details<<EOF" >> "$GITHUB_OUTPUT"
            echo "$test_details" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "test_details=" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack main status
        id: slack_main
        # FIX: Access outputs conditionally based on job result to avoid accessing
        # undefined outputs from skipped jobs. GitHub Actions doesn't resolve
        # outputs for skipped jobs, so we provide empty defaults.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}

          TRUNK_CALL_RESULT: ${{ needs.trunk.result }}
          TRUNK_OVERALL_RESULT: ${{ needs.trunk.result == 'skipped' && '' || needs.trunk.outputs.overall_result }}
          TRUNK_DEPLOY_RESULT: ${{ needs.trunk.result == 'skipped' && '' || needs.trunk.outputs.deployment_result }}
          TRUNK_DEPLOY_SUMMARY: ${{ needs.trunk.result == 'skipped' && '' || needs.trunk.outputs.deployment_summary }}
          TRUNK_DEPLOY_STAGE: ${{ needs.trunk.result == 'skipped' && '' || needs.trunk.outputs.deployment_stage }}
          TRUNK_DEPLOY_BRANCH: ${{ needs.trunk.result == 'skipped' && '' || needs.trunk.outputs.deployment_branch }}
          TRUNK_DEPLOY_APPLICATION: ${{ needs.trunk.result == 'skipped' && '' || needs.trunk.outputs.deployment_application }}
          TRUNK_DEPLOY_CHANGED: ${{ needs.trunk.result == 'skipped' && '' || needs.trunk.outputs.deployment_changed }}
          TRUNK_DEPLOY_COMMIT: ${{ needs.trunk.result == 'skipped' && '' || needs.trunk.outputs.deployment_commit }}
          TRUNK_ATS_RESULT: ${{ needs.trunk.result == 'skipped' && '' || needs.trunk.outputs.ats_result }}
          TRUNK_ATS_SUMMARY: ${{ needs.trunk.result == 'skipped' && '' || needs.trunk.outputs.ats_summary }}

          V66_CALL_RESULT: ${{ needs.v66.result }}
          V66_OVERALL_RESULT: ${{ needs.v66.result == 'skipped' && '' || needs.v66.outputs.overall_result }}
          V66_DEPLOY_RESULT: ${{ needs.v66.result == 'skipped' && '' || needs.v66.outputs.deployment_result }}
          V66_DEPLOY_SUMMARY: ${{ needs.v66.result == 'skipped' && '' || needs.v66.outputs.deployment_summary }}
          V66_DEPLOY_STAGE: ${{ needs.v66.result == 'skipped' && '' || needs.v66.outputs.deployment_stage }}
          V66_DEPLOY_BRANCH: ${{ needs.v66.result == 'skipped' && '' || needs.v66.outputs.deployment_branch }}
          V66_DEPLOY_APPLICATION: ${{ needs.v66.result == 'skipped' && '' || needs.v66.outputs.deployment_application }}
          V66_DEPLOY_CHANGED: ${{ needs.v66.result == 'skipped' && '' || needs.v66.outputs.deployment_changed }}
          V66_DEPLOY_COMMIT: ${{ needs.v66.result == 'skipped' && '' || needs.v66.outputs.deployment_commit }}
          V66_ATS_RESULT: ${{ needs.v66.result == 'skipped' && '' || needs.v66.outputs.ats_result }}
          V66_ATS_SUMMARY: ${{ needs.v66.result == 'skipped' && '' || needs.v66.outputs.ats_summary }}
        run: |
          # Use +u instead of -u to allow undefined variables (they'll be empty strings)
          set -eo pipefail

          # Ensure variables are defined (they'll be empty if jobs were skipped)
          : "${TRUNK_OVERALL_RESULT:=}"
          : "${V66_OVERALL_RESULT:=}"
          : "${TRUNK_DEPLOY_RESULT:=}"
          : "${V66_DEPLOY_RESULT:=}"
          : "${TRUNK_DEPLOY_SUMMARY:=}"
          : "${V66_DEPLOY_SUMMARY:=}"
          : "${TRUNK_DEPLOY_STAGE:=}"
          : "${V66_DEPLOY_STAGE:=}"
          : "${TRUNK_DEPLOY_BRANCH:=}"
          : "${V66_DEPLOY_BRANCH:=}"
          : "${TRUNK_DEPLOY_APPLICATION:=}"
          : "${V66_DEPLOY_APPLICATION:=}"
          : "${TRUNK_DEPLOY_CHANGED:=}"
          : "${V66_DEPLOY_CHANGED:=}"
          : "${TRUNK_DEPLOY_COMMIT:=}"
          : "${V66_DEPLOY_COMMIT:=}"
          : "${TRUNK_ATS_RESULT:=}"
          : "${V66_ATS_RESULT:=}"
          : "${TRUNK_ATS_SUMMARY:=}"
          : "${V66_ATS_SUMMARY:=}"

          deploy_result="${DEPLOY_RESULT:-$DEPLOY_JOB_RESULT}"
          deploy_summary="${DEPLOY_SUMMARY:-Deployment job result: ${DEPLOY_JOB_RESULT}.}"
          if [[ "$DEPLOY_JOB_RESULT" != "success" ]]; then
            deploy_result="failure"
            if [[ "${DEPLOY_RESULT:-}" == "failure" && -n "${DEPLOY_SUMMARY:-}" ]]; then
              deploy_summary="$DEPLOY_SUMMARY"
            else
              deploy_summary="Deployment job failed."
            fi
          fi

          case "$ATS_JOB_RESULT" in
            success)
              ats_summary="ATS Platform passed across ${ATS_SHARDS} shards."
              ;;
            failure)
              ats_summary="ATS Platform failed. Check logs for details."
              ;;
            skipped)
              ats_summary="ATS Platform was skipped."
              ;;
            cancelled)
              ats_summary="ATS Platform was cancelled."
              ;;
            *)
              ats_summary="ATS Platform result: ${ATS_JOB_RESULT}."
              ;;
          esac

          if [[ "$DEPLOY_JOB_RESULT" == "success" && "$ATS_JOB_RESULT" == "success" ]]; then
            overall="success"
          else
            overall="failure"
          fi

          status_label() {
            case "$1" in
              success) echo "SUCCESS" ;;
              failure) echo "FAILURE" ;;
              skipped) echo "SKIPPED" ;;
              cancelled) echo "CANCELLED" ;;
              *) tr '[:lower:]' '[:upper:]' <<<"${1:-UNKNOWN}" ;;
            esac
          }

          status_icon() {
            case "$1" in
              success) echo ":large_green_circle:" ;;
              failure) echo ":red_circle:" ;;
              skipped) echo ":large_yellow_circle:" ;;
              cancelled) echo ":black_circle:" ;;
              *) echo ":white_circle:" ;;
            esac
          }

          target_details=""
          selected_targets=0
          overall="success"

          append_target() {
            local name="$1"
            local call_result="$2"
            local reported_overall="$3"
            local deploy_result="$4"
            local deploy_summary="$5"
            local deploy_stage="$6"
            local branch="$7"
            local application="$8"
            local changed="$9"
            local commit="${10}"
            local ats_result="${11}"
            local ats_summary="${12}"

            selected_targets=$((selected_targets + 1))

            local target_result="${reported_overall:-$call_result}"
            if [[ "$call_result" != "success" ]]; then
              target_result="$call_result"
            fi
            if [[ "$target_result" != "success" ]]; then
              overall="failure"
            fi

            deploy_result="${deploy_result:-$call_result}"
            deploy_summary="${deploy_summary:-Deployment workflow result: ${call_result}.}"
            deploy_stage="${deploy_stage:-unknown}"
            branch="${branch:-unknown}"
            application="${application:-unknown}"
            changed="${changed:-unknown}"
            commit="${commit:-unknown}"
            ats_result="${ats_result:-skipped}"
            ats_summary="${ats_summary:-ATS result unavailable; inspect the target run.}"

            local target_icon
            local target_label
            local deploy_icon
            local deploy_label
            local ats_icon
            local ats_label
            target_icon="$(status_icon "$target_result")"
            target_label="$(status_label "$target_result")"
            deploy_icon="$(status_icon "$deploy_result")"
            deploy_label="$(status_label "$deploy_result")"
            ats_icon="$(status_icon "$ats_result")"
            ats_label="$(status_label "$ats_result")"

            if [[ -n "$target_details" ]]; then
              target_details+=$'\n\n'
            fi
            target_details+="*${name}:* ${target_icon} *${target_label}*"
            target_details+=$'\n'
            target_details+="*Deploy:* ${deploy_icon} ${deploy_label} — ${deploy_summary}"
            target_details+=$'\n'
            target_details+="*ATS:* ${ats_icon} ${ats_label} — ${ats_summary}"
            target_details+=$'\n'
            target_details+="*Application:* ${application}  •  *Branch:* ${branch}  •  *Commit:* \`${commit}\`"
            target_details+=$'\n'
            target_details+="*Stage:* ${deploy_stage}  •  *Lock changed:* ${changed}"
          }

          if [[ "$TRUNK_CALL_RESULT" != "skipped" ]]; then
            append_target \
              "trunk" \
              "$TRUNK_CALL_RESULT" \
              "$TRUNK_OVERALL_RESULT" \
              "$TRUNK_DEPLOY_RESULT" \
              "$TRUNK_DEPLOY_SUMMARY" \
              "$TRUNK_DEPLOY_STAGE" \
              "$TRUNK_DEPLOY_BRANCH" \
              "$TRUNK_DEPLOY_APPLICATION" \
              "$TRUNK_DEPLOY_CHANGED" \
              "$TRUNK_DEPLOY_COMMIT" \
              "$TRUNK_ATS_RESULT" \
              "$TRUNK_ATS_SUMMARY"
          fi

          if [[ "$V66_CALL_RESULT" != "skipped" ]]; then
            append_target \
              "6.6.x" \
              "$V66_CALL_RESULT" \
              "$V66_OVERALL_RESULT" \
              "$V66_DEPLOY_RESULT" \
              "$V66_DEPLOY_SUMMARY" \
              "$V66_DEPLOY_STAGE" \
              "$V66_DEPLOY_BRANCH" \
              "$V66_DEPLOY_APPLICATION" \
              "$V66_DEPLOY_CHANGED" \
              "$V66_DEPLOY_COMMIT" \
              "$V66_ATS_RESULT" \
              "$V66_ATS_SUMMARY"
          fi

          if [[ "$selected_targets" -eq 0 ]]; then
            overall="failure"
            target_details="No target workflow ran."
          fi

          if [[ "$overall" == "success" ]]; then
            status_color="#2eb67d"
          else
            status_color="#e01e5a"
          fi

          overall_label="$(status_label "$overall")"
          overall_icon="$(status_icon "$overall")"

          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "::error title=Missing Slack webhook::SLACK_WEBHOOK_URL is not configured; cannot send the nightly status notification."
            exit 1
          fi

          payload="$(jq -n \
            --arg text "Nightly PaaS ATS ${overall_label}: ${TARGET_SELECTION}" \
            --arg status_color "$status_color" \
            --arg overall_icon "$overall_icon" \
            --arg overall_label "$overall_label" \
            --arg target_selection "$TARGET_SELECTION" \
            --arg target_details "$target_details" \
            --arg run "$RUN_URL" \
            '{
              text: $text,
              attachments: [
                {
                  color: $status_color,
                  fallback: $text,
                  blocks: [
                    {type: "section", text: {type: "mrkdwn", text: "*Nightly PaaS ATS:* \($overall_icon) *\($overall_label)*\n*Selected targets:* \($target_selection)"}},
                    {type: "section", text: {type: "mrkdwn", text: $target_details}},
                    {type: "section", text: {type: "mrkdwn", text: "*Run:* <\($run)|Open GitHub Actions>"}}
                  ]
                }
              ]
            }')"

          response_file="${RUNNER_TEMP}/slack-response.txt"
          if ! http_status="$(curl -sS -o "$response_file" -w "%{http_code}" -H "Content-Type: application/json" -d "$payload" "$SLACK_WEBHOOK_URL")"; then
            echo "::error title=Slack notification failed::Slack webhook request failed."
            if [[ -s "$response_file" ]]; then
              sed -n '1,20p' "$response_file"
            fi
            exit 1
          fi

          if (( http_status < 200 || http_status >= 300 )); then
            echo "::error title=Slack notification failed::Slack webhook returned HTTP ${http_status}."
            if [[ -s "$response_file" ]]; then
              sed -n '1,20p' "$response_file"
            fi
            exit 1
          fi

          echo "Slack main notification sent."

      - name: Post test details as separate message
        if: steps.parse_logs.outputs.test_details != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_DETAILS: ${{ steps.parse_logs.outputs.test_details }}
        run: |
          set -euo pipefail

          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "::warning::SLACK_WEBHOOK_URL not configured; skipping test details message."
            exit 0
          fi

          # Post test details as a follow-up message
          payload="$(jq -n \
            --arg text "$TEST_DETAILS" \
            '{
              text: $text,
              mrkdwn: true
            }')"

          response_file="${RUNNER_TEMP}/slack-details-response.txt"
          if ! http_status="$(curl -sS -o "$response_file" -w "%{http_code}" -H "Content-Type: application/json" -d "$payload" "$SLACK_WEBHOOK_URL")"; then
            echo "::warning::Could not post test details follow-up message."
            exit 0
          fi

          if (( http_status < 200 || http_status >= 300 )); then
            echo "::warning::Slack test details message returned HTTP ${http_status}."
            exit 0
          fi

          echo "Test details message sent."
