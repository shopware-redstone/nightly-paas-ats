name: Shopware PaaS CLI Update Check

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sw-paas-cli-update-check
  cancel-in-progress: false

jobs:
  check-sw-paas-cli:
    name: Check sw-paas CLI release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Check latest sw-paas release
        id: sw_paas
        env:
          GH_TOKEN: ${{ secrets.PAAS_CLI_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          sw_paas_config=".github/sw-paas-cli.env"
          release_json="${RUNNER_TEMP}/sw-paas-release.json"
          archive="${RUNNER_TEMP}/sw-paas_Linux_x86_64.tar.gz"

          current_version="$(ruby -ne 'if /^SW_PAAS_CLI_VERSION=(.+)$/; puts $1.strip; exit; end' "$sw_paas_config")"
          : "${current_version:?Could not find SW_PAAS_CLI_VERSION in ${sw_paas_config}}"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/shopware/sw-paas/releases/latest" \
            -o "$release_json"

          latest_tag="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("tag_name")' "$release_json")"
          latest_version="${latest_tag#v}"
          is_newer="$(ruby -e 'require "rubygems"; puts Gem::Version.new(ARGV[0]) > Gem::Version.new(ARGV[1]) ? "true" : "false"' "$latest_version" "$current_version")"

          {
            echo "current_version=$current_version"
            echo "latest_version=$latest_version"
            echo "latest_tag=$latest_tag"
          } >> "$GITHUB_OUTPUT"

          if [[ "$is_newer" != "true" ]]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### sw-paas CLI version check"
              echo
              echo "Pinned version is current: \`${current_version}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          asset_url="$(ruby -rjson -e '
            release = JSON.parse(File.read(ARGV[0]))
            asset = release.fetch("assets").find { |entry| entry.fetch("name") == "sw-paas_Linux_x86_64.tar.gz" }
            abort "Release #{release.fetch("tag_name")} does not include sw-paas_Linux_x86_64.tar.gz" unless asset
            puts asset.fetch("browser_download_url")
          ' "$release_json")"

          # Extract SHA256 from release body metadata
          latest_sha256="$(ruby -rjson -e '
            release = JSON.parse(File.read(ARGV[0]))
            body = release.fetch("body", "")

            # Try to find sha256 in formats: "sha256:xxxxx" or "sha256 xxxxx"
            if match = body.match(/sha256[:\s]+([a-f0-9]{64})/i)
              puts match[1]
              exit 0
            end

            # Try reverse format: "xxxxx sha256" or "xxxxx:sha256"
            if match = body.match(/([a-f0-9]{64})[:\s]*sha256/i)
              puts match[1]
              exit 0
            end

            abort "Could not find SHA256 checksum in release body"
          ' "$release_json")" || {
            echo "::warning::SHA256 not found in release body, will download and calculate"
            curl -fsSL "$asset_url" -o "$archive"
            latest_sha256="$(sha256sum "$archive" | cut -d " " -f 1)"
          }

          LATEST_VERSION="$latest_version" LATEST_SHA256="$latest_sha256" ruby <<'RUBY'
            path = ".github/sw-paas-cli.env"
            content = File.read(path)

            content.sub!(/^SW_PAAS_CLI_VERSION=.+$/, "SW_PAAS_CLI_VERSION=#{ENV.fetch("LATEST_VERSION")}") ||
              abort("Could not update SW_PAAS_CLI_VERSION")
            content.sub!(/^SW_PAAS_CLI_SHA256=[a-f0-9]+$/, "SW_PAAS_CLI_SHA256=#{ENV.fetch("LATEST_SHA256")}") ||
              abort("Could not update SW_PAAS_CLI_SHA256")

            File.write(path, content)
          RUBY

          {
            echo "update_needed=true"
            echo "latest_sha256=$latest_sha256"
            echo "asset_url=$asset_url"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### sw-paas CLI update available"
            echo
            echo "- Current: \`${current_version}\`"
            echo "- Latest: \`${latest_version}\`"
            echo "- Linux x86_64 SHA256: \`${latest_sha256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open update pull request
        id: open_pr
        if: steps.sw_paas.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAAS_CLI_UPDATE_TOKEN }}
          LATEST_VERSION: ${{ steps.sw_paas.outputs.latest_version }}
          LATEST_SHA256: ${{ steps.sw_paas.outputs.latest_sha256 }}
          ASSET_URL: ${{ steps.sw_paas.outputs.asset_url }}
          PR_ASSIGNEE: ${{ vars.SW_PAAS_CLI_UPDATE_PR_ASSIGNEE || 'yusufttur' }}
        run: |
          set -euo pipefail

          # Version-specific branch name ensures each release gets its own PR.
          # After merge, the branch is cleaned up automatically.
          branch="automation/sw-paas-cli-update-${LATEST_VERSION}"
          title="Update sw-paas CLI to ${LATEST_VERSION}"
          body_file="${RUNNER_TEMP}/sw-paas-cli-update-pr.md"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git diff --check
          git add .github/sw-paas-cli.env
          git commit -m "Update sw-paas CLI to ${LATEST_VERSION}"
          git fetch origin "$branch":"refs/remotes/origin/$branch" >/dev/null 2>&1 || true
          git push --force-with-lease origin "$branch"

          cat > "$body_file" <<BODY
          ## Summary

          - Bump the pinned \`sw-paas\` CLI to \`${LATEST_VERSION}\`.
          - Update the Linux x86_64 archive checksum to \`${LATEST_SHA256}\`.

          ## Source

          Release asset: ${ASSET_URL}

          ## Validation

          - Downloaded \`sw-paas_Linux_x86_64.tar.gz\` from the latest GitHub release.
          - Computed the SHA256 checksum from the downloaded archive.
          BODY

          # Check if an open PR already exists for this branch
          existing_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --state open \
            --json url \
            --jq '.[0].url' 2>/dev/null || echo "")

          if [[ -n "$existing_pr" ]]; then
            echo "Reusing existing open PR: $existing_pr"
            pr_url="$existing_pr"
          else
            echo "Creating new PR..."
            pr_response=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "$title" \
              --body-file "$body_file" \
              --assignee "$PR_ASSIGNEE" 2>&1) || {
              echo "::error::Failed to create PR. Response: $pr_response"
              exit 1
            }

            # Extract URL from response or use gh pr view to get it
            if echo "$pr_response" | grep -q "^https://"; then
              pr_url="$pr_response"
            else
              # Fallback: query the PR we just created
              pr_url=$(gh pr view "$branch" \
                --repo "$GITHUB_REPOSITORY" \
                --json url \
                --jq '.url')
            fi
          fi

          echo "PR URL: $pr_url"
          pr_number=$(echo "$pr_url" | grep -oE '[0-9]+$')

          if [[ -z "$pr_number" ]]; then
            echo "::error::Could not extract PR number from URL: $pr_url"
            exit 1
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: steps.open_pr.outputs.pr_url
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LATEST_VERSION: ${{ steps.sw_paas.outputs.latest_version }}
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          PR_URL: ${{ steps.open_pr.outputs.pr_url }}
        run: |
          set -euo pipefail

          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "::error title=Missing Slack webhook::SLACK_WEBHOOK_URL is not configured"
            exit 1
          fi

          http_code=$(curl -w '%{http_code}' -s -o /dev/null -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d @- <<EOF
          {
            "text": "🚀 PaaS CLI Update Available: ${LATEST_VERSION} - PR #${PR_NUMBER}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚀 PaaS CLI Update Available",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Version:*\n\`${LATEST_VERSION}\`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*PR:*\n#${PR_NUMBER}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<${PR_URL}|View PR #${PR_NUMBER} on GitHub>"
                }
              }
            ]
          }
          EOF
          )

          if [[ "$http_code" != "200" ]]; then
            echo "::warning title=Slack notification failed::HTTP $http_code from Slack webhook"
            exit 1
          fi
